<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="t">
  <title id="t">Yksikkötestaus: suurennuslasi löytää bugin koodista, ja testien tulokset näkyvät hyväksyttyinä ja hylättyinä</title>
  <rect x="1" y="1" width="318" height="168" rx="14" fill="#fbf7f0" stroke="#dcd8ce"/>
  <!-- koodirivit -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="22" y1="34" x2="92" y2="34" stroke="#b74a26"/>
    <line x1="36" y1="54" x2="120" y2="54" stroke="#9a9ea1"/>
    <line x1="36" y1="74" x2="104" y2="74" stroke="#9a9ea1"/>
    <line x1="50" y1="94" x2="132" y2="94" stroke="#2d6a4f"/>
    <line x1="36" y1="114" x2="96" y2="114" stroke="#9a9ea1"/>
    <line x1="22" y1="134" x2="40" y2="134" stroke="#b74a26"/>
  </g>
  <!-- suurennuslasi ja bugi -->
  <g transform="translate(100 84)">
    <circle r="34" fill="#fffdf9" fill-opacity=".85" stroke="#1c2327" stroke-width="5"/>
    <line x1="25" y1="25" x2="48" y2="48" stroke="#1c2327" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(-2 2)">
